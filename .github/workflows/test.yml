name: ACP tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: acp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: aelix-acp --version
  native:
    name: Native candidate and ACP (${{ matrix.target }})
    timeout-minutes: ${{ matrix.target == 'darwin-x64' && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: win32-x64, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: runtime
        name: Pinned aelix-ai commit
        run: python -c "import json,os; ref=json.load(open('runtime-reference.json'))['commit']; print('aelix-ai', ref); open(os.environ['GITHUB_OUTPUT'],'a').write('ref='+ref+'\n')"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: handochan/aelix-ai
          ref: ${{ steps.runtime.outputs.ref }}
          path: .native-core
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.12.23'
      - run: uv sync --project .native-core --all-packages --python 3.12 --locked
      - run: python scripts/test_native.py --core .native-core --check-ref
      - name: Running images and large-line Stop
        run: uv run --project .native-core --all-packages --locked python scripts/test_running_images.py --aelix .native-core/${{ runner.os == 'Windows' && '.venv/Scripts/aelix.exe' || '.venv/bin/aelix' }} --stop-trials 100
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - run: uv build --wheel --out-dir .native-core/.local/wheels .native-core/packages/aelix-coding-agent/src/aelix_coding_agent/examples/starter
      - name: Offline package lifecycle through ACP
        run: python -c "import os,pathlib,subprocess,sys; root=pathlib.Path('.native-core'); cli=root/'.venv'/('Scripts/aelix.exe' if os.name=='nt' else 'bin/aelix'); wheel=next((root/'.local/wheels').glob('aelix_starter_ext-*.whl')); sys.exit(subprocess.call([sys.executable,'scripts/test_packages.py','--aelix',str(cli),'--wheel',str(wheel)]))"
  transcript-candidate:
    name: Native transcript candidate and ACP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # D16 development evidence until the shared runtime pin includes #655.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: handochan/aelix-ai
          ref: 7ebb6463f0b23128830046ad689d9c8631175f88
          path: .native-core
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.12.23'
      - run: uv sync --project .native-core --all-packages --python 3.12 --locked
      - run: >
          .native-core/.venv/bin/python -m unittest -v
          test_native_runtime.NativeRuntimeTests.test_cli_appends_native_turns_with_stable_live_and_replay_ids
          test_native_children.NativeChildrenTests.test_a_cancelled_calls_report_is_replayed_by_session_load
          test_native_children.NativeChildrenTests.test_transcript_replays_rewritten_tool_result_on_its_original_card
          test_native_children.NativeChildrenTests.test_transcript_preserves_standalone_nested_tool_updates
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
          AELIX_ACP_TEST_AELIX: ${{ github.workspace }}/.native-core/.venv/bin/aelix
          AELIX_ACP_REQUIRE_TRANSCRIPT: '1'
