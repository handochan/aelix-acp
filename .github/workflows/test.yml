name: ACP tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: acp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: aelix-acp --version
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: runtime
        run: python -c "import json,os; ref=json.load(open('runtime-reference.json'))['commit']; open(os.environ['GITHUB_OUTPUT'],'a').write('ref='+ref+'\n')"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: handochan/aelix-ai
          ref: ${{ steps.runtime.outputs.ref }}
          path: .native-core
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.12.23'
      - run: uv sync --project .native-core --all-packages --python 3.12 --locked
      - run: python scripts/test_native.py --core .native-core --check-ref
