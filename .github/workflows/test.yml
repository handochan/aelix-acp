name: ACP tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: aelix-acp --version
  public-beta2:
    name: Public beta.2 qualification (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install released native wheels and the ACP wheel
        run: |
          python -m venv .local/native
          .local/native/bin/python -m pip install --index-url https://pypi.org/simple --only-binary=:all: aelix==0.1.0b2
          python -m pip wheel --no-deps --wheel-dir .local/acp-wheel .
          .local/native/bin/python -m pip install --no-index .local/acp-wheel/*.whl
      - name: Verify wheel bytes and exercise actual native and ACP processes
        run: |
          .local/native/bin/python scripts/qualify_beta2.py --adapter .local/native/bin/aelix-acp --report .local/qualification.json
      - name: Verify sessionless management and installed ACP contracts (no host)
        run: |
          .local/native/bin/python scripts/qualify_management.py --adapter .local/native/bin/aelix-acp --native-only --report .local/management-qualification.json
      - name: Verify Ask/Yolo effects and audit additional native modes (no host)
        run: |
          .local/native/bin/python scripts/qualify_permissions.py --adapter .local/native/bin/aelix-acp --report .local/permission-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-beta2-python-${{ matrix.python }}
          path: |
            .local/qualification.json
            .local/management-qualification.json
            .local/permission-qualification.json
          if-no-files-found: error
